[options]
; =============================================================================
; Odoo 17 - configuración optimizada para un Droplet de 1 vCPU / 1GB RAM.
; Las credenciales de Postgres (host, puerto, usuario, password) NO van aquí:
; las inyecta el entrypoint oficial de la imagen odoo:17.0 a partir de las
; variables de entorno HOST/PORT/USER/PASSWORD definidas en .env.
; =============================================================================

; --- Modo de proceso ---------------------------------------------------------
; workers = 0 => modo threaded (single-process). Sin esto, con solo 1GB de RAM
; total (compartido con Node, Nginx y Postgres) los workers multi-proceso de
; Odoo agotarían la memoria casi de inmediato. Como bonus, en modo threaded
; Odoo sirve HTTP y websocket en el MISMO puerto 8069 (no hace falta el 8072
; de longpolling ni un segundo upstream en Nginx).
workers = 0
max_cron_threads = 1

; Nginx del host está delante de Odoo (proxy_mode habilita que Odoo confíe en
; X-Forwarded-* para conocer el esquema/host/IP reales del visitante).
proxy_mode = True

; --- Logging ------------------------------------------------------------------
; logfile = False => logs a stdout, visibles con `docker compose logs -f odoo`.
logfile = False
log_level = warn

; --- Addons / datos -----------------------------------------------------------
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo

; --- Límites de memoria (conservadores para 1GB RAM total del host) -----------
; soft: por encima de esto, Odoo intenta liberar memoria entre requests.
; hard: por encima de esto, Odoo mata el proceso en curso (evita que un solo
; request (p.ej. un reporte pesado) tumbe toda la máquina por OOM).
limit_memory_soft = 629145600
limit_memory_hard = 738197504

; --- Otros límites de seguridad/rendimiento ------------------------------------
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200

; Pool de conexiones a Postgres deliberadamente bajo: con workers=0 solo hay
; un proceso, y Postgres en el host ya sirve también al sitio Node.js.
db_maxconn = 4

; --- Selector de base de datos --------------------------------------------------
; Se deja abierto (True) SOLO durante la instalación inicial, para poder crear
; la base "turingtech_crm" desde el instalador web (ver README paso 4).
; ENDURECIMIENTO POST-INSTALACIÓN (README paso 5): una vez creada la base,
; cambiar a:
;   list_db = False
;   db_name = turingtech_crm
; y reiniciar el contenedor (`docker compose restart odoo`). Esto oculta el
; selector /web/database/selector y fija Odoo a una única base de datos.
list_db = True
