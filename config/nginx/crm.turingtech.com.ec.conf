# =============================================================================
# Nginx reverse proxy para Odoo 17 - crm.turingtech.com.ec
#
# Este archivo va en el NGINX DEL HOST (fuera de Docker):
#   sudo cp config/nginx/crm.turingtech.com.ec.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/crm.turingtech.com.ec.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Cloudflare (proxy naranja) está delante de este Nginx. Con el SSL/TLS mode
# de la zona en "Flexible", Cloudflare termina el HTTPS del visitante y le
# habla a este origen SOLO por HTTP (puerto 80) — por eso el bloque activo de
# abajo escucha únicamente en el puerto 80. Si en el futuro cambias la zona a
# "Full" o "Full (strict)", activa el bloque 443 comentado al final de este
# archivo (requiere un certificado — Certbot o Cloudflare Origin CA).
# =============================================================================

# --- (Opcional, hardening) restaurar la IP real del visitante -----------------
# Cloudflare proxea el tráfico, así que $remote_addr por defecto es la IP de
# Cloudflare, no la del visitante. Descomenta este bloque (y mantenlo
# actualizado con https://www.cloudflare.com/ips/) para que Nginx/Odoo vean la
# IP real vía el header CF-Connecting-IP.
#
# set_real_ip_from 173.245.48.0/20;
# set_real_ip_from 103.21.244.0/22;
# set_real_ip_from 103.22.200.0/22;
# set_real_ip_from 103.31.4.0/22;
# set_real_ip_from 141.101.64.0/18;
# set_real_ip_from 108.162.192.0/18;
# set_real_ip_from 190.93.240.0/20;
# set_real_ip_from 188.114.96.0/20;
# set_real_ip_from 197.234.240.0/22;
# set_real_ip_from 198.41.128.0/17;
# set_real_ip_from 162.158.0.0/15;
# set_real_ip_from 104.16.0.0/13;
# set_real_ip_from 104.24.0.0/14;
# set_real_ip_from 172.64.0.0/13;
# set_real_ip_from 131.0.72.0/22;
# real_ip_header CF-Connecting-IP;

server {
    listen 80;
    listen [::]:80;
    server_name crm.turingtech.com.ec;

    # Reportes, adjuntos e importaciones grandes en Odoo.
    client_max_body_size 100m;

    # Timeouts largos: exportaciones/reportes pesados pueden tardar.
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;
    proxy_read_timeout 720s;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Hardcodeado a "https": el origen solo recibe HTTP (Cloudflare Flexible),
    # pero con "Always Use HTTPS" activo en Cloudflare, TODO el tráfico que
    # llega aquí se originó como HTTPS del lado del visitante. Sin esto,
    # proxy_mode de Odoo pensaría que la conexión es insegura.
    proxy_set_header X-Forwarded-Proto https;

    # --- App principal (backend, web, xmlrpc, etc.) ---
    location / {
        proxy_pass http://127.0.0.1:8069;
        proxy_redirect off;
    }

    # --- Chat / notificaciones en vivo (websocket) ---
    # Con workers = 0, Odoo sirve HTTP y websocket en el MISMO puerto 8069
    # (no existe un puerto 8072 separado que proxear).
    location /websocket {
        proxy_pass http://127.0.0.1:8069;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Cache ligero de assets estáticos de Odoo.
    location ~* /web/static/ {
        proxy_pass http://127.0.0.1:8069;
        proxy_cache_valid 200 60m;
        expires 864000;
    }
}

# =============================================================================
# BLOQUE 443 (SSL) - DESACTIVADO POR DEFECTO.
#
# Descomenta este server{} completo (y comenta/borra el "listen 80" de arriba
# o añade un redirect 80->443) SOLO si cambias la zona de Cloudflare a
# "Full" o "Full (strict)", que exige que el origen también hable HTTPS.
#
# Necesitas un certificado en el origen. Dos opciones:
#
#   (a) Let's Encrypt / Certbot (certificado público, válido de cara a
#       cualquier cliente, no solo Cloudflare):
#         sudo certbot --nginx -d crm.turingtech.com.ec
#       Certbot suele reescribir este archivo automáticamente; las rutas
#       típicas quedan en:
#         ssl_certificate     /etc/letsencrypt/live/crm.turingtech.com.ec/fullchain.pem;
#         ssl_certificate_key /etc/letsencrypt/live/crm.turingtech.com.ec/privkey.pem;
#
#   (b) Cloudflare Origin CA (más simple si SOLO Cloudflare le habla a este
#       origen: certificado gratuito de 15 años emitido desde el dashboard de
#       Cloudflare, Menú SSL/TLS > Origin Server > Create Certificate).
#       Guarda el cert/key generados en, por ejemplo:
#         sudo mkdir -p /etc/nginx/ssl
#         sudo nano /etc/nginx/ssl/cloudflare-origin.pem   # certificado
#         sudo nano /etc/nginx/ssl/cloudflare-origin.key   # llave privada
#         ssl_certificate     /etc/nginx/ssl/cloudflare-origin.pem;
#         ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;
#
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     server_name crm.turingtech.com.ec;
#
#     # --- Opción (a) Let's Encrypt/Certbot ---
#     # ssl_certificate     /etc/letsencrypt/live/crm.turingtech.com.ec/fullchain.pem;
#     # ssl_certificate_key /etc/letsencrypt/live/crm.turingtech.com.ec/privkey.pem;
#
#     # --- Opción (b) Cloudflare Origin CA ---
#     # ssl_certificate     /etc/nginx/ssl/cloudflare-origin.pem;
#     # ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;
#
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_ciphers HIGH:!aNULL:!MD5;
#
#     client_max_body_size 100m;
#     proxy_connect_timeout 720s;
#     proxy_send_timeout 720s;
#     proxy_read_timeout 720s;
#
#     proxy_set_header Host $host;
#     proxy_set_header X-Forwarded-Host $host;
#     proxy_set_header X-Real-IP $remote_addr;
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#     proxy_set_header X-Forwarded-Proto https;
#
#     location / {
#         proxy_pass http://127.0.0.1:8069;
#         proxy_redirect off;
#     }
#
#     location /websocket {
#         proxy_pass http://127.0.0.1:8069;
#         proxy_http_version 1.1;
#         proxy_set_header Upgrade $http_upgrade;
#         proxy_set_header Connection "upgrade";
#     }
#
#     location ~* /web/static/ {
#         proxy_pass http://127.0.0.1:8069;
#         proxy_cache_valid 200 60m;
#         expires 864000;
#     }
# }
